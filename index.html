<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cursor Snake</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0f14;
    cursor: none;
  }
  #arena {
    position: relative;
    width: 100vw;
    height: 100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(57,255,176,0.06), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(57,180,255,0.06), transparent 40%),
      #0b0f14;
  }
  .item {
    position: absolute;
    transform: translate(-50%, -50%);
    will-change: transform;
    user-select: none;
    pointer-events: none;
  }
  .segment {
    position: absolute;
    border-radius: 9999px;
    transform: translate(-50%, -50%);
    will-change: transform;
    pointer-events: none;
  }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    60% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  .item-pop { animation: pop 220ms ease-out; }

  #dangerOverlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    cursor: pointer;
  }
  #dangerOverlay img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  #dangerOverlay::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1;
  }
  #dangerText {
    position: relative;
    z-index: 10;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 900;
    font-size: clamp(2rem, 8vw, 5rem);
    color: #fff;
    text-shadow: 0 4px 30px rgba(0,0,0,0.8);
    text-align: center;
    padding: 0 1.5rem;
    animation: pop 260ms ease-out;
  }
</style>
</head>
<body>

<div id="arena">

  <!-- Score -->
  <div class="absolute top-4 left-4 z-40 select-none">
    <div class="bg-black/40 backdrop-blur-md border border-emerald-400/30 rounded-2xl px-5 py-3 shadow-lg shadow-emerald-500/10">
      <div class="text-[10px] tracking-[0.3em] text-emerald-300/70 font-semibold">SCORE</div>
      <div id="scoreValue" class="text-3xl font-black text-emerald-300 leading-none mt-1">0</div>
    </div>
  </div>

  <!-- Instructions (fades out) -->
  <div id="hint" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-40 text-slate-400/70 text-sm tracking-wide select-none transition-opacity duration-700">
    move your cursor — the snake is hungry
  </div>

  <!-- Food & danger items + snake segments are injected here by game.js -->
</div>

<!-- Fullscreen danger reveal -->
<div id="dangerOverlay">
  <img id="dangerImg" src="" alt="" />
  <div id="dangerText"></div>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
